services:
  goonbank-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goonbank-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/jewbank.db
      - JwtSettings__Secret=GoonBankSuperSecretSecureKeyForJwtTokens2026!#*$
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: goonbank-proxy
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      # Host/IP the TLS certificate is issued for; set it in .env (see .env.example)
      - GOONBANK_HOST=${GOONBANK_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - goonbank-api

volumes:
  caddy_data:
  caddy_config:
